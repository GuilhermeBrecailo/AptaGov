services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["npm", "run", "db:migrate"]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config/filters.json:/app/config/filters.json:ro
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["node", ".output/server/index.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:4100:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config/filters.json:/app/config/filters.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ["node_modules/.bin/tsx", "src/worker.ts"]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config/filters.json:/app/config/filters.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
